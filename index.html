<script>
// إعداد ثوابت الاتصال الفعلي بقاعدة بيانات كلية مجتمع الأقصى
const SUPABASE_URL = 'https://supabase.co'; 
const SUPABASE_ANON_KEY = 'sb_publishable_O28XTWBruit3W6Q8O1VOTA_3hEZJK2E'; 
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const notice = document.getElementById('notice');
function showNotice(msg, isError = false) {
  notice.textContent = msg;
  notice.className = 'notice show ' + (isError ? 'error' : 'success');
  window.scrollTo({top: notice.offsetTop - 20, behavior: 'smooth'});
}

// التحكم البرمجي بالتنقل بين القوائم والأزرار لضمان عمل الواجهات
document.querySelectorAll('[data-go]').forEach(btn => {
  btn.addEventListener('click', () => {
    const targetId = btn.getAttribute('data-go');
    document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
    const targetMain = document.getElementById(targetId);
    if(targetMain) targetMain.classList.remove('hidden');
    document.getElementById('authPanel').classList.add('hidden');
  });
});

document.querySelectorAll('[data-open="auth"]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('authPanel').classList.remove('hidden');
    window.scrollTo({top: document.getElementById('authPanel').offsetTop - 20, behavior: 'smooth'});
  });
});

document.getElementById('authToggle').addEventListener('click', () => {
  document.getElementById('authPanel').classList.toggle('hidden');
});

// ١. جلب التخصصات الأكاديمية المجهزة مسبقاً في قاعدتك وعرضها بالقائمة
async function loadSpecialties() {
  try {
    const { data, error } = await _supabase.from('specialties').select('*');
    const selectElement = document.getElementById('regSpecialty');
    selectElement.innerHTML = '';
    
    if (error) throw error;
    
    if (data && data.length > 0) {
      let initialOption = document.createElement('option');
      initialOption.value = '';
      initialOption.textContent = 'اختر تخصصك الأكاديمي...';
      selectElement.appendChild(initialOption);
      
      data.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        selectElement.appendChild(opt);
      });
    } else {
      selectElement.innerHTML = '<option value="">لا توجد تخصصات مسجلة حالياً</option>';
    }
  } catch (err) {
    console.error('خطأ في تحميل التخصصات:', err.message);
    document.getElementById('regSpecialty').innerHTML = '<option value="">فشل تحميل التخصصات من الخادم</option>';
  }
}

// ٢. جلب دليل المشرفين الجاهز مسبقاً في قاعدتك وعرضه في جدول الموقع
async function loadSupervisors() {
  try {
    const { data, error } = await _supabase.from('supervisors').select('*');
    const tableBody = document.getElementById('supervisorsTableBody');
    tableBody.innerHTML = '';

    if (error) throw error;

    if (data && data.length > 0) {
      data.forEach(sup => {
        // نتحقق من المسميات المحتملة للأعمدة في جدولك (تجنباً لأي اختلاف في الأسماء)
        let name = sup.name || sup.full_name || 'غير محدد';
        let specialty = sup.specialty || sup.specialty_name || 'عام';
        let region = sup.region || sup.location || 'كل المناطق';
        
        let row = `<tr>
          <td>${name}</td>
          <td>${specialty}</td>
          <td>${region}</td>
        </tr>`;
        tableBody.insertAdjacentHTML('beforeend', row);
      });
    } else {
      tableBody.innerHTML = '<tr><td colspan="3" class="muted" style="text-align:center;">لا يوجد مشرفون مسجلون في قاعدة البيانات حالياً</td></tr>';
    }
  } catch (err) {
    console.error('خطأ في تحميل المشرفين:', err.message);
    document.getElementById('supervisorsTableBody').innerHTML = '<tr><td colspan="3" class="notice error" style="text-align:center;">فشل جلب قائمة المشرفين من الخادم</td></tr>';
  }
}

// معالجة وإرسال طلب تسجيل طالب جديد
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const universityId = document.getElementById('regId').value;
  const specialtyId = document.getElementById('regSpecialty').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;

  try {
    const { data: authData, error: authError } = await _supabase.auth.signUp({
      email: email,
      password: password
    });

    if (authError) throw authError;

    if (authData.user) {
      const { error: profileError } = await _supabase.from('students').insert([
        {
          id: authData.user.id,
          full_name: name,
          university_id: universityId,
          specialty_id: specialtyId,
          email: email
        }
      ]);

      if (profileError) throw profileError;

      showNotice('تم إنشاء حساب الطالب بنجاح! يرجى مراجعة بريدك الإلكتروني لتأكيد التسجيل.');
      document.getElementById('signupForm').reset();
    }
  } catch (err) {
    showNotice('حدث خطأ أثناء التسجيل: ' + err.message, true);
  }
});

// تشغيل جلب البيانات فور تحميل الصفحة
document.addEventListener('DOMContentLoaded', () => {
  loadSpecialties();
  loadSupervisors();
});
</script>
</body>
</html>
